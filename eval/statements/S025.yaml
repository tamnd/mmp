name: MinimalModel.ToricConeTheorem
from: S2
license: Apache-2.0
informal: |
  The toric cone theorem, combinatorial form (Cox, Little and Schenck, Theorem 6.3.12 and Proposition 6.4.4; Reid 1983, Decomposition of toric morphisms). Let `F` be a complete simplicial fan in `ℝⁿ` and `D` an R-Cartier torus-invariant divisor. Then `D` is nef, in the sense that its support function is convex (`Fan.IsNef`), exactly when its degree on the curve of each wall `σ ∩ σ'` of two maximal cones is nonnegative. The degree is read off the fan with the data of the wall (`Fan.WallData.degree`).  This is the combinatorial form of the theorem. The geometric form says that the cone of curves of the toric variety is spanned by the classes of the wall curves `V(τ)`. It needs the toric variety as a scheme, with its curves and intersection numbers.
faithful: |
  def ToricConeTheorem : Prop :=
    ∀ (n : ℕ) (F : Fan n), F.IsComplete → F.IsSimplicialFan → ∀ D : F.TDivisor ℝ, F.IsRCartier D →
      (F.IsNef D ↔ ∀ σ σ' : PointedCone ℝ (NR n), F.IsWallPair σ σ' →
        ∀ W : F.WallData σ σ', 0 ≤ W.degree D)
planted: |
