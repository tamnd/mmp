statement: |
  lemma ConcaveOn.isBoundedUnder_abs (hf : ConcaveOn ℝ C f) {x₀ : E} (hC : C ∈ 𝓝 x₀) :
      (𝓝 x₀).IsBoundedUnder (· ≤ ·) |f| ↔ (𝓝 x₀).IsBoundedUnder (· ≥ ·) f
answer: |
  by
    simpa [Pi.neg_def, Pi.abs_def] using hf.neg.isBoundedUnder_abs hC
