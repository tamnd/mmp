statement: |
  theorem Convex.average_mem [IsFiniteMeasure μ] [NeZero μ] (hs : Convex ℝ s) (hsc : IsClosed s)
      (hfs : ∀ᵐ x ∂μ, f x ∈ s) (hfi : Integrable f μ) : (⨍ x, f x ∂μ) ∈ s
answer: |
  hs.integral_mem hsc (ae_mono' smul_absolutelyContinuous hfs) hfi.to_average
