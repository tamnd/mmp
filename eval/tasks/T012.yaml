name: WeierstrassCurve.Projective.nonsingular_neg
from: S0
license: Apache-2.0
statement: |
  lemma nonsingular_neg {P : Fin 3 → F} (hP : W.Nonsingular P) : W.Nonsingular <| W.neg P
answer: |
  by
    by_cases hPz : P z = 0
    · simp only [neg_of_Z_eq_zero hP.left hPz, nonsingular_smul _ (isUnit_Y_of_Z_eq_zero hP hPz).neg,
        nonsingular_zero]
    · simp only [neg_of_Z_ne_zero hPz, nonsingular_smul _ <| Ne.isUnit hPz,
        nonsingular_neg_of_Z_ne_zero hP hPz]
