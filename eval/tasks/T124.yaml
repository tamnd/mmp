statement: |
  lemma isClosed_dual (hp : ∀ x, Continuous (p x)) : IsClosed (dual p s : Set N)
answer: |
  by
    rw [← s.biUnion_of_singleton]
    simp_rw [dual_iUnion, Submodule.coe_iInf, dual_singleton]
    exact isClosed_biInter fun x hx ↦ isClosed_Ici.preimage <| hp _
