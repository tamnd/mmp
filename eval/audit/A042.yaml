reference: |
  A big `ℝ`-divisor: `ℝ`-linearly equivalent to an ample divisor plus an effective divisor.
lean: |
  def IsBig (D : Divisor ℝ X) : Prop :=
    ∃ A E : Divisor ℝ X, IsAmple A ∧ RLinEquiv D (A + E)
