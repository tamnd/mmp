reference: |
  An infinite sequence of flips from `A`.
lean: |
  def HasInfiniteFlips (A : PairModel k) : Prop :=
    ∃ model : ℕ → PairModel k, model 0 = A ∧ ∀ i, IsFlip (model i) (model (i + 1))
