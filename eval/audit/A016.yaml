reference: |
  A `ℚ`-Cartier `ℝ`-divisor: a positive multiple is a Cartier divisor. Then its coefficients are rational.
lean: |
  def IsQCartierReal (D : Divisor ℝ X) : Prop :=
    ∃ m : ℕ, 0 < m ∧ ∃ E : Divisor ℤ X, IsCartier E ∧ (m : ℝ) • D = E.toReal
