    globalMld P < ((1 : ℝ) : WithBot ℝ) ∧
      ∃ v : Valuation (FF X) VZ, IsDivisorial v ∧ IsExceptional v ∧
        ∃ A, LogDiscrepancyIs P v A ∧ A ≤ 1
