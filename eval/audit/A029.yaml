  The pair `(X, Δ)` is enc, exceptionally non-canonical (Han-Liu, Definition 3.8(1)): `mld(X, Δ) < 1`, and exactly one divisorial valuation `E` exceptional over `X` has `a(E, X, Δ) ≤ 1`.
