  A contraction: a projective morphism `f` with `f_* 𝒪_X = 𝒪_Z`.
lean: |
  def IsContraction {Z : NormalVariety k} (f : X.toScheme ⟶ Z.toScheme) : Prop :=
    IsProjectiveHom f ∧ ∀ U : Z.toScheme.Opens, IsIso (f.app U)
