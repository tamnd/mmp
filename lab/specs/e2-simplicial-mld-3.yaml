name: e2-simplicial-mld-3
experiment: E2
question: For each simplicial toric 3-fold germ C^3/G, with G = N/Z^3 abelian of order r <= 1200 and the rays primitive, what are the mld, the terminal and canonical germs and the enc germs, is every terminal germ cyclic of type 1/r(1, -1, a), and do the isolated cyclic germs agree with the run e2-cyclic-quotient-mld-3 to index 40?
tool: mmp
node: MMXCD16PTN # HanLiuEncACC, Target T
nodes: [MMWK2DDDPC, MMAWP4SA44] # ACCMld, ToricMMP
inputs:
  dimension: 3
  max_index: 1200
  family: simplicial
  list_index: 30
outputs: [germs.json, indices.json, summary.md]
notes: E2 in dimension 3 for milestone S2, over all simplicial toric germs, cyclic or not, isolated or not, up to the permutations of the coordinates. The germs are enumerated by the Hermite normal form of the dual lattice. Terminal and canonical use the mld of the germ, the least age over G, so 1/2(1,1,0) is canonical and not terminal. enc counts the primitive box points of age at most 1; enc_hl adds mld < 1 (Han-Liu Definition 3.8(1)). germs.json lists the germs of index at most 30; indices.json counts every index. The work grows like r^4. Measured on a loaded 10-core arm64 laptop, index 600 took 4.5 min, index 800 7 min and index 1000 12.4 min, so index 1200, at about 26 min, is the largest that runs in about 30 min. It has no Lean certificate yet (13.4).
