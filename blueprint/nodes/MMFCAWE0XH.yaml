title: "Special termination from T(n-1)"
statement: "Assume T(n-1). Let $(X,\\Delta)$ be a dlt pair of dimension $n$. Then each MMP for $(X,\\Delta)$ is an isomorphism near $\\lfloor\\Delta\\rfloor$ after finitely many steps."
