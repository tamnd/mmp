slug: "termination-scaling-big"
kind: "theorem"
title: "Termination with scaling for big boundary"
statement: "Let $(X,\\Delta)$ be a $\\mathbb{Q}$-factorial klt pair, projective over $U$, with $\\Delta$ big over $U$. Then the $(K_X+\\Delta)$-MMP with scaling of an ample divisor terminates (BCHM 1.4.2)."
sources:
  - { paper: BCHM10, loc: "Corollary 1.4.2" }
uses: [MM9399B0QP] # BCHM
lean: { statement: MinimalModel.TerminationScalingBig }
tier: S
notes: "Statement S23 of spec 06.2.2, in the file MinimalModel/Statements/Termination.lean. The class in the spec is theorem. The vocabulary is ready. The statement is planned for milestone S1. The Lean statement follows BCHM 1.4.2: the scaling divisor is a divisor C >= 0 such that the pair with boundary Delta + C is klt and K + Delta + C is nef. An ample scaling divisor is a case of it. The statement is about each program with scaling, with any choice of the rays."
