title: "Abundance for numerical dimension 0"
statement: "Let $(X,\\Delta)$ be a projective lc pair with $K_X+\\Delta$ nef and $\\nu(K_X+\\Delta)=0$. Then $K_X+\\Delta$ is semiample (Nakayama, Gongyo)."
lean: { statement: MinimalModel.AbundanceNuZero }
tier: S
notes: "Statement S43 of spec 06.2.2. The statement is in mmp-lean, file MinimalModel/Statements/Abundance.lean. The class in the spec is theorem. The vocabulary is ready. The statement is planned for milestone S2. The Lean statement cites Nakayama, Chapter V, Corollary 4.9, for klt pairs with rational coefficients, and Gongyo, Math. Res. Lett. 18 (2011), arXiv:1101.1394, Theorem 6.1 and Lemma 6.2, for lc pairs with real coefficients. Theorem 1.2 of that paper is the existence of minimal models, not abundance. For a rational boundary, Lemma 6.2 is Gongyo, arXiv:1005.2796, Theorem 1.2. Nakayama's book has no open copy, so its number is the one that Lazić and Peternell cite and is not checked. The paper record of the source is not written yet (spec 07)."
