tag: "MMFAWNT87R"
slug: "toric-wall-relation"
kind: "theorem"
title: "The wall relation"
statement: "Let $\\sigma$ and $\\sigma'$ be cones of a fan, each spanned by a basis of the lattice, whose bases share every vector but one: $v$ in $\\sigma$ and $v'$ in $\\sigma'$. Then there are unique integers $b_i$ with $v+v'=\\sum_i b_i u_i$, where the $u_i$ are the shared vectors."
sources:
