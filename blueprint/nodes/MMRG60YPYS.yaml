notes: "Statement S57 of spec 06.2.2. The statement is in mmp-lean, file MinimalModel/Statements/Effective.lean. The class in the spec is refuted. The vocabulary is ready: the statement is the negation of the conjecture, so it needs no abelian varieties, and the witness is in the docstring. The statement is planned for milestone S1. The class refuted means that the literature disproves the conjecture. The node states the negation. Spec 06.2.1 keeps the class claimed until the counterexample is refereed, so the node has the kind claim. The claim record is claims/arXiv-2610-09270.yaml (claim C14 of spec 01.3). The Lean form of the conjecture takes X projective, so its negation is stronger than the negation of the source."
