statement: "The cone conjecture (Kawamata-Morrison): for a klt Calabi-Yau pair, $\\mathrm{Aut}(X)$ acts on the effective nef cone with a rational polyhedral fundamental domain, and the same holds for the movable cone and the birational automorphisms."
