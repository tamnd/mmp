slug: "surface-cone-theorem"
kind: "theorem"
title: "The cone theorem for smooth surfaces"
statement: "Let $X$ be a smooth projective surface. Then $\\overline{NE}(X)=\\overline{NE}(X)_{K_X\\ge0}+\\sum_j\\mathbb{R}_{\\ge0}[C_j]$ for countably many rational curves $C_j$ with $0<-K_X\\cdot C_j\\le3$."
