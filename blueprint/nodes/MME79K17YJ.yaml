title: "Termination for pseudo-effective lc 4-folds"
statement: "Let $(X,\\Delta)$ be an lc pair of dimension 4 with $K_X+\\Delta$ pseudo-effective. There is no infinite sequence of $(K_X+\\Delta)$-flips (Moraga; Chen-Tsakanikas)."
