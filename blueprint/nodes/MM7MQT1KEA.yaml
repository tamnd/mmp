slug: "kawamata-viehweg"
kind: "theorem"
title: "Kawamata-Viehweg vanishing"
statement: "Let $(X,\\Delta)$ be a klt pair and $\\pi:X\\to U$ a projective morphism. Let $N$ be a $\\mathbb{Q}$-Cartier Weil divisor with $N\\equiv_U K_X+\\Delta+M$, where $M$ is $\\pi$-nef and $\\pi$-big. Then $R^i\\pi_*\\mathcal{O}_X(N)=0$ for $i>0$."
sources:
  - { paper: KM98, loc: "Theorem 2.70" }
lean: { statement: MinimalModel.KawamataViehweg }
tier: S
notes: "Statement S02 of spec 06.2.2. The statement is in mmp-lean, file MinimalModel/Statements/Foundations.lean, with the vocabulary of MinimalModel/Statements/Curves.lean and MinimalModel/Statements/Cohomology.lean. The class in the spec is theorem. The vocabulary is ready. The statement is planned for milestone S2. The Lean statement takes a Q-boundary and Q-divisors, as KM98 does. The higher direct images are the sheaf cohomology of Mathlib on the inverse images of the affine open sets of U."
