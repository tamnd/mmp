slug: "rationality-theorem"
kind: "theorem"
title: "The rationality theorem"
statement: "Let $(X,\\Delta)$ be a projective klt pair with $K_X+\\Delta$ not nef, and $H$ an ample Cartier divisor. Then the nef threshold $r=\\max\\{t: H+t(K_X+\\Delta)\\text{ nef}\\}$ is a rational number, with a denominator at most $a(\\dim X+1)$, where $a$ is the Cartier index of $K_X+\\Delta$."
sources:
