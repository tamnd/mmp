tag: "MMAWP4SA44"
slug: "toric-mmp"
kind: "theorem"
title: "The toric MMP"
statement: "Let $\\Sigma$ be a simplicial projective fan and $D$ a torus-invariant $\\mathbb{Q}$-divisor. Each toric $D$-MMP of $X_\\Sigma$ ends with a minimal model or a Mori fibre space, and the mld at each torus-fixed point is the minimum of a linear function on the lattice points of the cone."
