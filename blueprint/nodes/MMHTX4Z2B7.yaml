kind: "theorem"
title: "The length of extremal rays"
statement: "Let $(X,\\Delta)$ be a projective klt pair. Each $(K_X+\\Delta)$-negative extremal ray is spanned by the class of a rational curve $C$ with $0<-(K_X+\\Delta)\\cdot C\\le2\\dim X$."
