slug: "finiteness-of-models"
kind: "theorem"
title: "Finiteness of models"
statement: "$E_n$ of BCHM: let $\\pi:X\\to U$ be projective, with $X$ of dimension $n$ and a klt pair $(X,\\Delta_0)$. Let $V$ be a finite dimensional affine space of divisors defined over the rationals, and $A\\ge0$ a general ample $\\mathbb{Q}$-divisor over $U$. Then finitely many birational maps $\\psi_j:X\\dashrightarrow Z_j$ over $U$ give, up to isomorphism, every weak log canonical model over $U$ of $K_X+\\Delta$ with $\\Delta\\in\\mathcal{L}_A(V)$."
sources:
  - { paper: BCHM10, loc: "Theorem E" }
uses: [MM9399B0QP] # BCHM
lean: { statement: MinimalModel.FinitenessOfModels }
tier: S
notes: "Statement S34 of spec 06.2.2. The statement is in mmp-lean, file MinimalModel/Statements/Models.lean, with the vocabulary of MinimalModel/Statements/LinearSystems.lean and MinimalModel/Statements/BasicRelative.lean. The class in the spec is theorem. The vocabulary is partial: it needed linear systems, which LinearSystems.lean now gives. The statement is planned for milestone S2. BCHM (arXiv:math/0610203) Theorem E asks for a general ample Q-divisor A over U: kA is very ample over U and A = A'/k for a very general A' in the linear system of kA (the paragraph after Definition 1.1.4). The Lean statement says this directly. For each divisor D that is very ample over U and each m > 0, the conclusion holds for A = (D + div f)/m and every f outside countably many hypersurfaces of H^0(X, O(D)). The polynomial functions there are generated by the linear forms. The field is uncountable, since over a countable field countably many hypersurfaces cover the space. Very ampleness over U is checked on each affine open set of U, and U is a normal variety as in S31. The very general set may depend on V, which the proof of Lemma 7.2 and Corollary 1.1.5 allow. The conclusion is that of Theorem E: weak log canonical models over all of L_A(V), each equal to some psi_j followed by an isomorphism. Each log terminal model is a weak log canonical model, so this implies the form of the spec row with log terminal models over a rational polytope. Theorem E was checked against arXiv:math/0610203v2."
