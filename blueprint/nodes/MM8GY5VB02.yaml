notes: "Statement S34 of spec 06.2.2. The Lean statement is not written yet. BCHM (arXiv:math/0610203) Theorem E asks for a general ample Q-divisor A over U: kA is very ample over U and A = A'/k for a very general A' in the linear system of kA over U (the paragraph after Definition 1.1.4). Each finiteness result of the paper has this hypothesis: Theorem E, Corollary 1.1.5, Theorem B, Corollary 3.11.2 and Lemmas 7.1 and 7.2. Lemma 7.1 also asks that each boundary of the polytope is klt, but A is still general. No result of the paper states the finiteness for each ample A, and a form for some ample A is weaker than the source. The vocabulary has no linear systems as parameter spaces and no very general members, so the statement waits for them. The class in the spec is theorem. The vocabulary is partial (general members of linear systems). The statement is planned for milestone S2."
