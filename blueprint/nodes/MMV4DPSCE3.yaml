slug: "kleiman-criterion"
kind: "theorem"
title: "Kleiman's criterion"
statement: "Let $X$ be a projective variety and $D$ an $\\mathbb{R}$-Cartier divisor on $X$. Then $D$ is ample if and only if $D\\cdot z>0$ for each nonzero class $z$ in $\\overline{NE}(X)$."
