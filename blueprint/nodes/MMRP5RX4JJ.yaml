slug: "castelnuovo"
kind: "theorem"
title: "Castelnuovo's contraction theorem"
statement: "Let $X$ be a smooth projective surface and $E\\subset X$ a curve with $E\\cong\\mathbb{P}^1$ and $E^2=-1$. There is a morphism $X\\to Y$ onto a smooth projective surface $Y$ that contracts $E$ to a point and is an isomorphism outside $E$."
sources:
