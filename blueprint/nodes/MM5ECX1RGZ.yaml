title: "Abundance for lc 3-folds"
statement: "Let $(X,\\Delta)$ be a projective lc pair of dimension 3 with $K_X+\\Delta$ nef. Then $K_X+\\Delta$ is semiample (Miyaoka, Kawamata, Keel-Matsuki-McKernan)."
lean: { statement: MinimalModel.ThreefoldAbundance }
tier: S
notes: "Statement S17 of spec 06.2.2. The statement is in mmp-lean, file MinimalModel/Statements/LowDim.lean. The class in the spec is theorem. The vocabulary is ready. The statement is planned for milestone S2. The Lean statement asks for a boundary with rational coefficients, as Keel, Matsuki and McKernan 1994, Theorem 1.1, does. The paper has no open copy, so the number is not checked. Matsuki corrected Chapter 6 of the paper in arXiv:math/0302360. The paper record of the source is not written yet (spec 07)."
