slug: "basepoint-free"
kind: "theorem"
title: "The base point free theorem"
statement: "Let $(X,\\Delta)$ be a projective klt pair and $D$ a nef Cartier divisor such that $aD-(K_X+\\Delta)$ is nef and big for some $a>0$. Then $|bD|$ is base point free for all $b\\gg0$, so $D$ is semiample."
sources:
