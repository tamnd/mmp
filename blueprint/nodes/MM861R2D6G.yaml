tag: "MM861R2D6G"
slug: "surface-mmp"
kind: "theorem"
title: "The MMP for smooth projective surfaces"
statement: "Let $X$ be a smooth projective surface. A finite sequence of contractions of $(-1)$-curves gives a smooth projective surface $Y$ such that $K_Y$ is nef, or $Y\\cong\\mathbb{P}^2$, or $Y$ is a $\\mathbb{P}^1$-bundle over a smooth curve."
sources:
