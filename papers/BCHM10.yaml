notes: "The theorem numbers are those of spec 03.6. Theorem 1.2 and Theorem E are checked against arXiv:math/0610203. Theorem E, Corollary 1.1.5 and Lemmas 7.1 and 7.2 ask for a general ample Q-divisor A over U, so S34 states it with the linear systems and very general members of MinimalModel/Statements/LinearSystems.lean in mmp-lean. BCHM say that they do not prove the termination of every sequence of flips. Nobody has read the source for the project yet. The read tag is the tag of the row in spec 07."
