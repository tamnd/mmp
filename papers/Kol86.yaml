notes: "The paper is not on arXiv, and the project has no copy of it, so the two theorem numbers are not checked against the paper. They are checked only against later papers that cite it. Fujino, arXiv:0704.0073v3, Theorem 1.1, is the injectivity theorem and cites Theorem 2.2 of this paper. Fujino does not cite Theorem 2.1 there. Pareschi and Popa, arXiv:math/0608127, cite Theorem 2.1(i) for the torsion-freeness of the sheaves R^j f_* ω_Y. S03 is the conjunction of KollarInjectivity and KollarTorsionFreeness in mmp-lean. Its torsion-freeness has the form of Fuj11 3.4(i) with a boundary Δ, which is more general than Theorem 2.1(i). The title, the journal, the pages and the DOI are checked against Crossref. Nobody has read the source for the project yet. The read tag is the tag of the row in spec 07."
