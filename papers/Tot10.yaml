notes: "Conjecture 1.1 is checked against arXiv:0901.3361v2. It is stated for a klt Calabi-Yau pair (X/S, Δ) over a base S, with part (1) for the action of Aut(X/S, Δ) on the effective nef cone and part (2) for the action of PsAut(X/S, Δ) on the effective movable cone. Totaro says that for X terminal and Δ = 0 it is Kawamata's conjecture, which generalizes Morrison's. S55 in mmp-lean takes S to be a point. The numbering is not checked against the journal. Row T10-11 of spec 07 names Kawamata, Morrison and Totaro, the conjecture and its known cases. This record covers the row. The journal data and the DOI come from the arXiv record. Nobody has read the source for the project yet. The read tag is the tag of the row in spec 07."
