notes: "Theorem 1.1 is checked against arXiv:1609.05543v2: for a natural number d and a positive real number ε, the projective varieties X such that (X, B) is ε-lc of dimension d for some boundary B and -(K_X + B) is nef and big form a bounded family. The numbering is not checked against the journal. Row T10-04 of spec 07 also has Birkar, Anti-pluricanonical systems on Fano varieties, arXiv:1603.05765, on the boundedness of complements. That paper has no record yet. The title, the journal, the pages and the DOI are checked against Crossref. Nobody has read the source for the project yet. The read tag is the tag of the row in spec 07."
